    <title>Recipe: Lemon Rice</title>

  <body>
    <main>
      <h1>Lemon Rice</h1>
      <p>
        Cook two cups of basmati rice. Fry mustard seeds, curry leaves and peanuts in oil, add
        turmeric, then fold in the rice and the juice of two lemons. Serve warm with yogurt on the
        side.
      </p>
    </main>
