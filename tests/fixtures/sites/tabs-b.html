    <title>Recipe: Tomato Soup</title>
  </head>
  <body>
    <main>
      <h1>Tomato Soup</h1>
      <p>
        Roast a kilo of tomatoes with garlic and onion for forty minutes, blend with a cup of stock,
        season with salt, pepper and a pinch of sugar, and finish with a spoon of cream.
      </p>
    </main>
  </body>
